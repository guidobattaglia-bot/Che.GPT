                const div = document.createElement('div');
                div.classList.add('mensaje', 'mensaje-ia');
                div.innerHTML = `<span>${saludoInicialHTML}</span>`;
                chatMessagesWrapper.appendChild(div);
            } else {
                historialChat.forEach(msg => {
                    const tipo = msg.role === 'user' ? 'mensaje-usuario' : 'mensaje-ia';
                    let textoParaMostrar = msg.parts[0].text;
                    if (textoParaMostrar.startsWith('[En respuesta a:')) {
                        textoParaMostrar = textoParaMostrar.replace(/\[En respuesta a: "(.*?)"\]\n/, '<div style="font-size: 0.85rem; border-left: 2px solid rgba(255,255,255,0.4); padding-left: 8px; margin-bottom: 5px; opacity: 0.9; background: rgba(0,0,0,0.15); border-radius: 4px; padding: 4px; text-shadow: none;">Citado: "$1"</div>');
                    }
                    agregarMensajeDirecto(textoParaMostrar, tipo, true);
                });
            }
        }
        renderizarPantallaInicial();

        if (localStorage.getItem('pais_usuario')) selectPaisUsuario.value = localStorage.getItem('pais_usuario');
        if (localStorage.getItem('provincia_usuario')) selectProvinciaUsuario.value = localStorage.getItem('provincia_usuario');
        if (localStorage.getItem('provincia_ia')) selectProvinciaIA.value = localStorage.getItem('provincia_ia');

        function checkPais() {
            if (selectPaisUsuario.value !== 'Argentina') {
                selectProvinciaUsuario.value = '---';
                selectProvinciaUsuario.disabled = true;
            } else {
                selectProvinciaUsuario.disabled = false;
            }
        }
        checkPais();

        selectPaisUsuario.addEventListener('change', () => { checkPais(); localStorage.setItem('pais_usuario', selectPaisUsuario.value); localStorage.setItem('provincia_usuario', selectProvinciaUsuario.value); });
        selectProvinciaUsuario.addEventListener('change', () => localStorage.setItem('provincia_usuario', selectProvinciaUsuario.value));
        selectProvinciaIA.addEventListener('change', () => localStorage.setItem('provincia_ia', selectProvinciaIA.value));

        inputMensaje.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });

        btnToggle.addEventListener('click', () => sidebar.classList.toggle('collapsed'));
        btnCloseSidebar.addEventListener('click', () => sidebar.classList.add('collapsed'));
        if (window.innerWidth > 768) sidebar.classList.remove('collapsed');

        replyCloseBtn.addEventListener('click', () => { replyContainer.classList.remove('active'); mensajeCitadoActual = null; });

        btnFormal.addEventListener('click', () => {
            document.getElementById('confianza').value = 0; document.getElementById('val-confianza').innerText = '0';
            document.getElementById('empatia').value = 0; document.getElementById('val-empatia').innerText = '0';
            document.getElementById('humor').value = 0; document.getElementById('val-humor').innerText = '0';
            document.getElementById('tono').value = 10; document.getElementById('val-tono').innerText = '10';
            document.getElementById('extension').value = 0; document.getElementById('val-extension').innerText = '0';
        });

        btnRandom.addEventListener('click', () => {
            selectProvinciaIA.selectedIndex = Math.floor(Math.random() * selectProvinciaIA.options.length);
            selectPaisUsuario.selectedIndex = Math.floor(Math.random() * selectPaisUsuario.options.length);
            checkPais();
            if (selectPaisUsuario.value === 'Argentina') selectProvinciaUsuario.selectedIndex = Math.floor(Math.random() * selectProvinciaUsuario.options.length);

            const sliders010 = ['confianza', 'empatia', 'humor', 'tono', 'extension'];
            sliders010.forEach(id => { const val = Math.floor(Math.random() * 11); document.getElementById(id).value = val; document.getElementById('val-' + id).innerText = val; });
            const edadVal = Math.floor(Math.random() * (80 - 18 + 1)) + 18; document.getElementById('edad').value = edadVal; document.getElementById('val-edad').innerText = edadVal;
        });

        btnNuevoChat.addEventListener('click', () => {
            historialChat = [];
            localStorage.removeItem('chegpt_historial');
            renderizarPantallaInicial();
            replyContainer.classList.remove('active');
            mensajeCitadoActual = null;
        });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let reconocimiento = null;
        let dictando = false;
        
        if (SpeechRecognition) {
            reconocimiento = new SpeechRecognition(); reconocimiento.continuous = false; reconocimiento.lang = 'es-AR';
            reconocimiento.onresult = (event) => {
                const textoEscuchado = event.results[0][0].transcript;
                inputMensaje.value += (inputMensaje.value ? ' ' : '') + textoEscuchado;
                inputMensaje.style.height = 'auto'; inputMensaje.style.height = (inputMensaje.scrollHeight) + 'px';
            };
            reconocimiento.onend = () => { dictando = false; btnLive.innerText = "🎙️"; btnLive.classList.remove('btn-live-on'); };
            reconocimiento.onerror = () => { dictando = false; btnLive.innerText = "🎙️"; btnLive.classList.remove('btn-live-on'); };
        }

        btnLive.addEventListener('click', () => {
            if (!SpeechRecognition) return alert("Tu navegador no soporta el dictado por voz.");
            if (!dictando) { reconocimiento.start(); dictando = true; btnLive.innerText = "🔴"; btnLive.classList.add('btn-live-on'); } 
            else { reconocimiento.stop(); dictando = false; btnLive.innerText = "🎙️"; btnLive.classList.remove('btn-live-on'); }
        });

        function agregarMensajeDirecto(texto, tipo, esRestauracion = false) {
            const div = document.createElement('div');
            div.classList.add('mensaje', tipo);
            const spanTexto = document.createElement('span');
            spanTexto.innerHTML = texto.replace(/\n/g, '<br>');
            div.appendChild(spanTexto);

            if (tipo === 'mensaje-ia' && !texto.includes("Procesando chamuyo")) {
                const accionesDiv = document.createElement('div');
                accionesDiv.classList.add('mensaje-acciones');
                
                const btnCopiar = document.createElement('button');
                btnCopiar.className = 'btn-accion-msj'; btnCopiar.title = 'Copiar mensaje'; btnCopiar.innerHTML = '📋';
                btnCopiar.onclick = () => { 
                    const textoPuro = texto.replace(/<br>/g, '\n').replace(/<[^>]*>?/gm, '');
                    navigator.clipboard.writeText(textoPuro); 
                    btnCopiar.innerHTML = '✔️'; 
                    setTimeout(() => btnCopiar.innerHTML = '📋', 2000); 
                };

                const btnResponder = document.createElement('button');
                btnResponder.className = 'btn-accion-msj btn-responder'; btnResponder.title = 'Responder a este mensaje';
                btnResponder.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" style="vertical-align: middle;"><circle cx="12" cy="12" r="11" fill="var(--sol)" /><path d="M10.5 15.5L5.5 10.5l5-5v3.5c4 0 6.5 1.5 8 5.5-1.5-2.5-4-3-8-3v3.5z" fill="#121212" /></svg>`;
                btnResponder.onclick = () => { 
                    const textoLimpio = texto.replace(/<br>/g, '\n').replace(/<[^>]*>?/gm, '');
                    mensajeCitadoActual = textoLimpio; 
                    replyTextSpan.innerText = textoLimpio; 
                    replyContainer.classList.add('active'); 
                    inputMensaje.focus(); 
                };

                accionesDiv.appendChild(btnCopiar); accionesDiv.appendChild(btnResponder); div.appendChild(accionesDiv);
            }

            if (!esRestauracion && tipo === 'mensaje-usuario' && chatMessagesWrapper.innerHTML.includes(saludoInicialHTML)) {
                chatMessagesWrapper.innerHTML = '';
            }

            chatMessagesWrapper.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        btnEnviar.addEventListener('click', async () => {
            let texto = inputMensaje.value.trim();
            if (!texto) return;

            let textoFinalParaEnviar = texto;
            let htmlParaMostrarUsuario = texto;

            if (mensajeCitadoActual) {
                textoFinalParaEnviar = `[En respuesta a: "${mensajeCitadoActual}"]\n${texto}`;
                htmlParaMostrarUsuario = `<div style="font-size: 0.85rem; border-left: 2px solid rgba(255,255,255,0.4); padding-left: 8px; margin-bottom: 5px; opacity: 0.9; background: rgba(0,0,0,0.15); border-radius: 4px; padding: 4px; text-shadow: none;">Citado: "${mensajeCitadoActual}"</div>${texto}`;
            }

            agregarMensajeDirecto(htmlParaMostrarUsuario, 'mensaje-usuario');
            
            historialChat.push({ role: 'user', parts: [{ text: textoFinalParaEnviar }] });
            localStorage.setItem('chegpt_historial', JSON.stringify(historialChat));
            
            inputMensaje.value = ''; inputMensaje.style.height = 'auto'; replyContainer.classList.remove('active'); mensajeCitadoActual = null;

            const perfilConfig = {
                provincia: selectProvinciaIA.value, paisUsuario: selectPaisUsuario.value, provinciaUsuario: selectProvinciaUsuario.value,
                confianza: parseInt(document.getElementById('confianza').value), empatia: parseInt(document.getElementById('empatia').value),
                humor: parseInt(document.getElementById('humor').value), tono: parseInt(document.getElementById('tono').value),
                edad: parseInt(document.getElementById('edad').value), extension: parseInt(document.getElementById('extension').value)
            };

            const cartelViejo = document.getElementById('cartel-escribiendo');
            if (cartelViejo) cartelViejo.remove();

            // NUEVO CARTEL: "Procesando chamuyo... 🧉"
            const divLoading = document.createElement('div'); 
            divLoading.id = 'cartel-escribiendo'; 
            divLoading.classList.add('mensaje', 'mensaje-ia');
            divLoading.innerHTML = `<span>Procesando chamuyo... 🧉</span>`; 
            chatMessagesWrapper.appendChild(divLoading); 
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const req = await fetch('https://che-gpt.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ historial: historialChat, perfil: perfilConfig })
                });

                if (!req.ok) {
                    throw new Error(`Error en el servidor: ${req.status}`);
                }

                const res = await req.json();
                
                const cartelParaBorrar = document.getElementById('cartel-escribiendo'); 
                if (cartelParaBorrar) cartelParaBorrar.remove();
                
                if (res && res.respuesta && res.respuesta.trim() !== "") {
                    historialChat.push({ role: 'model', parts: [{ text: res.respuesta }] });
                    localStorage.setItem('chegpt_historial', JSON.stringify(historialChat));
                    agregarMensajeDirecto(res.respuesta, 'mensaje-ia');
                } else {
                    throw new Error("Respuesta vacía recibida");
                }
                chatHistory.scrollTop = chatHistory.scrollHeight;
            } catch (e) {
                const cartelParaBorrar = document.getElementById('cartel-escribiendo'); 
                if (cartelParaBorrar) cartelParaBorrar.remove();
                
                agregarMensajeDirecto("Se me trabó la neurona con esa consulta. Tirame de nuevo o fijate si se cortó la señal.", 'mensaje-error');
                
                historialChat.pop();
                localStorage.setItem('chegpt_historial', JSON.stringify(historialChat));
            }
        });

        inputMensaje.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btnEnviar.click(); }});
    </script>
</body>
</html>
